name: palimpsest
kind: standalone
version: 1.0.0
description: "Palimpsest memory backend for Hermes: swap the memory layer to local-first semantic recall + knowledge graph + auto-ingest over a private local REST service (port 8090). No API key, no third-party dependencies."
pip_dependencies: []
provides_hooks:
  # Event hooks this plugin registers via ctx.register_hook() — the validator
  # compares this list against what register() actually registers.
  #
  # pre_llm_call: feeds the thought skeleton for the current turn.
  #
  # NOTE: on_pre_compress and on_session_end are *MemoryProvider methods*, not
  # event hooks — the host calls them through the provider interface, so they
  # must not be declared here. Declaring on_pre_compress made `plugins doctor`
  # report "unknown hook 'on_pre_compress'"; declaring on_session_end made it
  # report "declares hook but registration did not add it". Neither changes
  # behaviour — only the accuracy of this declaration.
  - pre_llm_call
