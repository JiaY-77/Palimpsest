name: palimpsest
kind: standalone
version: 1.0.0
description: "Palimpsest memory backend for Hermes: swap the memory layer to local-first semantic recall + knowledge graph + auto-ingest over a private local REST service (port 8090). No API key, no third-party dependencies."
pip_dependencies: []
provides_hooks:
  # Event hooks this plugin registers via ctx.register_hook() — the validator
  # compares this list against what register() actually registers.
  #
  # pre_llm_call: feeds the thought skeleton for the current turn.
  #
  # NOTE: on_pre_compress is a *MemoryProvider method*, not an event hook —
  # the host calls it through the provider interface, so it must not be
  # declared here. Declaring it made `plugins doctor` report
  # "unknown hook 'on_pre_compress'" — no behaviour change, only the
  # accuracy of this declaration. (#183's on_session_end entry is gone
  # along with the handoff chain itself, issue #317.)
  - pre_llm_call
