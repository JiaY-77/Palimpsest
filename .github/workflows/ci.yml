name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 规则集由 pyproject.toml 的 [tool.ruff] 决定；ruff 版本与 requirements-dev.txt 对齐，
      # 避免门禁含义随版本漂移
      - name: Install ruff
        run: pip install ruff==0.16.7

      - name: Ruff check
        run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # mypy 要能解析第三方类型：triviumdb 自带 .pyi，requests 靠 types-requests
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 测试使用 conftest 注入的确定性 fake embedder，不依赖 Ollama

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # 覆盖率先做基线观测，暂不设 --cov-fail-under 门槛
      - name: Run tests
        run: python -m pytest tests/ -v --cov=core --cov=mcp_tools --cov-report=term-missing
