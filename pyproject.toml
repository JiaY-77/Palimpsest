[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "palimpsest"
version = "2.18.0"
description = "A local-first long-term memory system: TriviumDB vector storage + Ollama/OpenAI embeddings, providing memory write/retrieve, knowledge graph, and knowledge-base tools via MCP/REST/CLI."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.136.1",
    "httpx==0.28.1",
    "mcp==1.29.0",
    "openai==2.33.0",
    "pydantic==2.13.3",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.27",
    "requests==2.33.1",
    # 锁 0.9.0b2：#72（0.8.11 文本索引校验与「flush() 保留已有 .text」语义冲突，
    # 会导致含 .text 的整库写失败）已由上游修复，修复随 0.9.0-beta.2 落地；
    # 勿回 0.8.11（问题版本）。0.9.0 正式版发布后再评估升正式版。
    "triviumdb==0.9.0b2",
    "uvicorn==0.46.0",
]

[project.optional-dependencies]
# 本地词嵌入（EMBEDDING_PROVIDER=local）：进程内 GGUF 推理，不装也能用 ollama/openai
local-embed = ["llama-cpp-python>=0.3.36,<0.4"]

[project.scripts]
palimpsest-cli = "scripts.palimpsest_cli:main"

[tool.setuptools]
packages = ["core", "mcp_tools", "scripts"]

# ---------------------------------------------------------------------------
# Ruff —— 静态质量门禁（CI 全量阻断，见 .github/workflows/ci.yml 的 lint job）
#
# 为什么显式写 select 而不依赖 ruff 默认值：默认规则集随 ruff 版本演进，
# 显式钉住才能保证「本地跑 == CI 跑」，避免升级 ruff 后门禁含义漂移。
#
# 中文项目注意：RUF001/002/003 把中文全角标点报为「歧义 Unicode 字符」，
# 对本仓库的注释/文档是纯噪音（实测 5000+ 条），统一 ignore；若将来要开启，
# 必须先批量处理全角标点，不能直接放开。
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["venv", ".venv", "eval/.tmp"]

[tool.ruff.lint]
select = [
    "E4",     # pycodestyle：import 位置、多语句同行（E401/E402/E702）
    "E7",     # pycodestyle：语句级问题（E711/E712/E713/E714/E721/E722/E731/E741）
    "E9",     # pycodestyle：运行时错误（E902/E999）
    "F",      # pyflakes：未用 import/变量、未定义名、f-string 无占位
    "I",      # isort：import 排序
    "UP",     # pyupgrade：旧语法现代化
    "B",      # flake8-bugbear：易错模式
    "BLE001", # flake8-blind-except：宽泛 except（审阅 P0 点名）
    "S110",   # flake8-bandit：try-except-pass（审阅 P0 点名）
    "RUF",    # ruff 专属规则（含 RUF100 失效 noqa）
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "FURB",   # refurb
]
ignore = [
    "RUF001", # 歧义 Unicode 字符 —— 中文全角标点（见上方说明）
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["core", "mcp_tools", "scripts"]

# ---------------------------------------------------------------------------
# mypy —— 类型检查（非严格起步；范围覆盖 core/ + server/ + client/）
#
# 目标不是一步到位 strict，而是先让已有的类型注解变成真约束：core/ 的注解最完整；
# server/client 是 protocols.Store 的两个实现，纳入范围后两者会**对着协议静态
# 对拍**（此前 LocalStore 的 create_edge 位置参数错位、search_similar 把
# query 字符串当向量转发，都是扩范围当天当场被 mypy 抓出来的）。
# mcp_tools / scripts 待后续按同样方式纳入。
# 默认不检查未标注函数体（check_untyped_defs = false），要收紧时再打开。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["core", "server", "client"]
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

# llama-cpp-python 是可选依赖（extras: local-embed），上游既无 .pyi 也无 py.typed。
# 不忽略会报 import-not-found（未装）或 import-untyped（装了），两种都让 CI 的 mypy job 红。
# 只豁免这一个模块，其余第三方仍按 types-requests 等桩包严格检查。
[[tool.mypy.overrides]]
module = ["llama_cpp", "llama_cpp.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# 路径解析说明：
#   config.py 已将 DB_PATH 等相对路径在类定义时基于项目根（config.py 所在目录）
#   解析为绝对路径，import 不依赖也不修改进程当前工作目录；mcp_tools/_common.py
#   仅保留 sys.path 注入（直接跑仓库内脚本时用到），已移除 os.chdir 全局副作用。
# ---------------------------------------------------------------------------
