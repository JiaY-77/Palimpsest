[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "palimpsest"
version = "2.2.0"
description = "A local-first long-term memory system: TriviumDB vector storage + Ollama/OpenAI embeddings, providing memory write/retrieve, knowledge graph, and knowledge-base tools via MCP/REST/CLI."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.136.1",
    "mcp==1.29.0",
    "openai==2.33.0",
    "pydantic==2.13.3",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.27",
    "requests==2.33.1",
    "triviumdb==0.8.2",
    "uvicorn==0.46.0",
]

[project.scripts]
palimpsest-cli = "scripts.palimpsest_cli:main"

[tool.setuptools]
packages = ["core", "mcp_tools", "scripts"]

# ---------------------------------------------------------------------------
# 已知限制（本次工程化先不动，属于更大重构）：
#   mcp_tools/_common.py 在 import 时会向 sys.path 注入项目根并 os.chdir 到项目根。
#   作为 pip 包安装后，项目根 = site-packages 下的包目录，os.chdir 到该目录并
#   非当前工作目录，属危险/意外行为；但这不影响「可安装、palimpsest-cli 可用」，
#   故本次仅记录，不改动核心逻辑。
# ---------------------------------------------------------------------------
